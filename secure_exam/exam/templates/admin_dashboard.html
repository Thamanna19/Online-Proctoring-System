<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Secure Exam Portal</title>
    <style>
        :root {
            --primary-color: #3498db;
            --admin-color: #9b59b6;
            --dark-color: #2c3e50;
            --light-gray: #ecf0f1;
            --success-color: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 2rem;
            color: var(--dark-color);
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 2rem;
        }

        .header {
            border-bottom: 1px solid #eee;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        h2 {
            color: var(--admin-color);
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
        }

        h3 {
            color: var(--dark-color);
            margin: 1.5rem 0;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .course-button {
            width: 100%;
            padding: 1.5rem 1rem;
            background-color: white;
            color: var(--admin-color);
            border: 2px solid var(--admin-color);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .course-button:hover {
            background-color: var(--admin-color);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(155, 89, 182, 0.2);
        }

        .logout-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .logout-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .admin-info {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .course-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .dashboard-container {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            h3 {
                font-size: 1.3rem;
            }
            
            .course-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2>Welcome, Admin!</h2>
            <div class="admin-info">You have access to manage all courses and exams</div>
        </div>

        <h3>Select Course</h3>
        
        <div class="course-grid">
            {% for c in courses %}
                <form action="{% url 'admin_course_view' c %}" method="get">
                    <button type="submit" class="course-button">
                        {{ c }}
                    </button>
                </form>
            {% endfor %}
        </div>
    </div>
</body>
</html>
