<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course }} - Admin Dashboard</title>
    <style>
        :root {
            --primary-color: #3498db;
            --admin-color: #9b59b6;
            --dark-color: #2c3e50;
            --light-gray: #ecf0f1;
            --border-color: #ddd;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 2rem;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .course-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            position: relative;
        }

        .course-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: var(--admin-color);
            border-radius: 8px 8px 0 0;
        }

        h2 {
            color: var(--admin-color);
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h3 {
            color: var(--dark-color);
            margin: 2rem 0 1rem 0;
            font-size: 1.5rem;
            font-weight: 500;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 0.5rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .student-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .student-item:hover {
            background-color: var(--light-gray);
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .student-score {
            font-weight: 600;
            color: var(--dark-color);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background-color: #e8f4fc;
        }

        .empty-message {
            color: #7f8c8d;
            font-style: italic;
            padding: 1rem;
        }

        .action-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--admin-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background-color: #8e44ad;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .course-container {
                padding: 1.5rem;
            }
            
            h2 {
                font-size: 1.6rem;
            }
            
            .student-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="course-container">
        <a href="{% url 'admin_dashboard' %}" class="back-link">← Back to Dashboard</a>
        
        <h2>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7L12 12L21 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 17L12 22L21 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 12L12 17L21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{ course }}
        </h2>

        <h3>Enrolled Students</h3>
        
        <ul class="student-list">
            {% for student in students %}
                <li class="student-item">
                    <div class="student-info">
                        <span>{{ student.user.username }}</span>
                    </div>
                    <span class="student-score">Score: {{ student.score|default:"Not taken" }}</span>
                </li>
            {% empty %}
                <li class="empty-message">No students enrolled in this course.</li>
            {% endfor %}
        </ul>

        <div class="action-section">
            <a href="{% url 'create_exam' course %}" class="action-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Create New Exam
            </a>
        </div>
    </div>
</body>
</html>
