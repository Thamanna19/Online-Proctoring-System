<!DOCTYPE html>
<html>
<head>
    <title>Create Question</title>
</head>
<body>
    <h2>Create Question for {{ exam.title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Question Text:</label><br>
        <textarea name="question_text" rows="4" cols="50"></textarea><br><br>

        <label>Question Type:</label>
        <select name="question_type">
            <option value="MCQ">MCQ</option>
            <option value="CODING">Coding</option>
        </select><br><br>

        <label>Options (comma separated for MCQ):</label><br>
        <input type="text" name="options"><br><br>

        <label>Correct Answer:</label><br>
        <input type="text" name="correct_answer"><br><br>

        <button type="submit">Create</button>
    </form>
</body>
</html>
